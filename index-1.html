<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Happy Birthday Uday 🎂</title><style>*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;font-family:Segoe UI,sans-serif;background:linear-gradient(135deg,#ff9a9e,#fad0c4,#a18cd1);color:#fff}.card{width:90%;max-width:430px;text-align:center;padding:38px 24px;border-radius:28px;background:#ffffff2e;backdrop-filter:blur(14px);border:1px solid #ffffff59;box-shadow:0 18px 45px #00000038;position:relative;z-index:2}.cake{font-size:58px;animation:bounce 1.5s infinite}h1{font-size:32px;margin:12px 0 8px}.age{font-size:19px;margin-bottom:26px}button{border:0;border-radius:30px;padding:15px 23px;background:#fff;color:#9a55d6;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px #0003}.message{display:none;margin-top:25px;padding:22px;border-radius:20px;background:#ffffff38;line-height:1.7;font-size:17px;animation:open .8s ease}.message.show{display:block}.heart{position:absolute;bottom:-50px;animation:floatUp linear forwards;z-index:1}@keyframes bounce{50%{transform:translateY(-10px)}}@keyframes open{from{opacity:0;transform:scale(.7) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}@keyframes floatUp{from{transform:translateY(0);opacity:0}20%{opacity:.9}to{transform:translateY(-110vh);opacity:0}}</style></head><body><div class="card"><div class="cake">🎂</div><h1>Happy Birthday, Uday! 🎉</h1><div class="age">✨ 16 Years of Awesomeness ✨</div><button onclick="openMessage()">💌 Click Here to Open Message</button><div class="message" id="message"><p>Thank you for coming into my life. ❤️<br><br>You made so many moments more special. I'm really grateful for you. ✨<br><br>Keep smiling and keep shining! 🌟<br><br>Once again, HAPPY 16th BIRTHDAY, UDAY! 🎂🎉❤️</p></div></div><script>function openMessage(){document.getElementById('message').classList.add('show');for(let i=0;i<25;i++)setTimeout(createHeart,i*45)}function createHeart(){const h=document.createElement('div');h.className='heart';h.textContent=['❤️','💖','✨','🎈','🎉'][Math.floor(Math.random()*5)];h.style.left=Math.random()*100+'vw';h.style.fontSize=15+Math.random()*25+'px';h.style.animationDuration=3+Math.random()*4+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),7000)}</script></body></html>
